<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="fav.png">
<title>Contact - PilotPrepHub</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  color: white;
}

.container {
  text-align: center;
  padding: 60px 20px 30px;
}

h1 {
  font-size: 42px;
}

.tagline {
  font-size: 16px;
  opacity: 0.85;
  margin-bottom: 25px;
}

.section {
  padding: 35px 20px;
  max-width: 800px;
  margin: auto;
}

.section h2 {
  font-size: 24px;
  margin-bottom: 12px;
}

.section p {
  font-size: 15px;
  opacity: 0.85;
}

footer {
  background: rgba(0,0,0,0.3);
  padding: 15px;
  text-align: center;
}

.hidden {
  opacity: 0;
  transform: translateY(30px);
}

.show {
  opacity: 1;
  transform: translateY(0);
  transition: 0.8s;
}
</style>
</head>

<body>

<div class="container">
  <h1>Contact Us</h1>
  <div class="tagline">We’re here to help 🤝</div>
</div>

<div class="section hidden">
  <h2>Reach Out</h2>
  <p>Have feedback or facing issues? We’d love to hear from you.</p>
</div>

<div class="section hidden">
  <h2>Email</h2>
  <!-- <p>support@PilotPrepHub.in</p> -->
   <p>pilotprephub@gmail.com</p>
</div>

<div class="section hidden">
  <h2>Feedback</h2>
  <p>Your feedback helps us improve the platform.</p>
</div>

<footer>
  <p>PilotPrepHub © 2026</p>
</footer>

<script>
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add("show");
    }
  });
});
document.querySelectorAll(".hidden").forEach(el => observer.observe(el));
</script>

</body>
</html>
